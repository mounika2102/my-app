name: Full DevOps Pipeline with Terraform and Ansible firstapp

on:
  push:
    branches:
      - New

jobs:

  Docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Docker Login
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} \
          -p ${{ secrets.DOCKER_PASSWORD }}  
          
      - name: Build Docker Image
        run: |
          docker build -t 020217/my-app:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push 020217/my-app:${{ github.run_number }}

  terraform:
    needs: Docker
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
          

      - name: Terraform Version
        run: terraform version

      - name: Install OpenShift CLI
        run: |
            curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz
            tar -xvf oc.tar.gz
            sudo mv oc /usr/local/bin/
            oc version  
        
      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Debug Variables
        run: |
          echo "SERVER=[$TF_VAR_openshift_server]"
      
          if [ -z "$TF_VAR_openshift_server" ]; then
            echo "SERVER VARIABLE EMPTY"
            exit 1
          fi
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}

      - name: Debug OpenShift URL
        run: |
          echo "Length: ${#TF_VAR_openshift_server}"
      
          printf '%s\n' "$TF_VAR_openshift_server"
      
          echo "$TF_VAR_openshift_server" | od -c
      
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}    

      - name: Verify OpenShift Login
        run: |
          SERVER=$(echo "$TF_VAR_openshift_server" | tr -d '\n')
          curl -k -H "Authorization: Bearer $TF_VAR_openshift_token" "$TF_VAR_openshift_server/version"
        env:
            TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
            TF_VAR_openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}  

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
          TF_VAR_openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          
      - name: Clean Variables
        run: |
          echo "TF_VAR_openshift_server=$(echo "$TF_VAR_openshift_server" | tr -d '\n')" >> $GITHUB_ENV
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_VAR_image: 020217/my-app:${{ github.run_number }}
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
          TF_VAR_openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}

  ansible:

    needs: terraform

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
      - name: Install OpenShift CLI
        run: |
            curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz
            tar -xvf oc.tar.gz
            sudo mv oc /usr/local/bin/
            oc version

      - name: Run Playbook
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: ansible-playbook deploy.yml
