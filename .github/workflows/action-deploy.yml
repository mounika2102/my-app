name: Full DevOps Pipeline

on:
  push:
    branches:
      - New

jobs:

  terraform:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version
        
      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Debug Variables
        run: |
          echo "SERVER=[$TF_VAR_openshift_server]"
      
          if [ -z "$TF_VAR_openshift_server" ]; then
            echo "SERVER VARIABLE EMPTY"
            exit 1
          fi
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}

      - name: Debug OpenShift URL
        run: |
          echo "Length: ${#TF_VAR_openshift_server}"
      
          printf '%s\n' "$TF_VAR_openshift_server"
      
          echo "$TF_VAR_openshift_server" | od -c
      
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}    

      - name: Verify OpenShift Login
        run: |
          curl -k -H "Authorization: Bearer $TF_VAR_openshift_token" "$TF_VAR_openshift_server/version"
          env:
            TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
            TF_VAR_openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}  

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
          TF_VAR_openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}


      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_VAR_openshift_server: ${{ secrets.OPENSHIFT_SERVER }}
          TF_VAR_openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}

  ansible:

    needs: terraform

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Run Playbook
        run: ansible-playbook deploy.yml
