#deleting the file
name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  
jobs:

  docker:

    runs-on: ubuntu-latest

    steps:
    - name: Delete Docker Image Tag
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

        echo "🔐 Logging into Docker Hub..."

        RESPONSE=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" -H "Content-Type: application/json" -d '{"username": "'"${{ secrets.DOCKER_USERNAME }}"'","password": "'"${{ secrets.DOCKER_PASSWORD }}"'"}')

        echo "Login Response: $RESPONSE"

        TOKEN=$(echo "$RESPONSE" | jq -r '.token')

        if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
        echo "❌ Failed to get token"
        exit 1
        fi

        echo "✅ Token received"
        echo "✅ Fetching all tags..."

        TAGS=$(curl -s -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/my-app/tags?page_size=100" | jq -r '.results[].name')

        echo "Tags found:"
        echo "$TAGS"

        echo "$TAGS" | while read TAG; do
        if [ -z "$TAG" ]; then
        continue
        fi

        echo "🗑️ Deleting tag: $TAG"

        STATUS=$(curl -s -o delete_output.txt -w "%{http_code}" -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/my-app/tags/$TAG/")

        echo "Status: $STATUS"
        cat delete_output.txt

        if [ "$STATUS" = "204" ]; then
        echo "✅ Deleted $TAG"
        else
        echo "⚠️ Failed to delete $TAG (Status: $STATUS)"
        fi
        done
