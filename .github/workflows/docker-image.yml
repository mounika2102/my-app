#deleting the file
name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  
jobs:

  docker:

    runs-on: ubuntu-latest

    steps:
    - name: Delete Docker Image Tag
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

        RESPONSE=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" -H "Content-Type: application/json" -d "{"username": "${{ secrets.DOCKER_USERNAME }}", "password": "${{ secrets.DOCKER_PASSWORD }}"}")

        TOKEN=$(echo $RESPONSE | jq -r '.token')

        curl -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/my-app/tags/mouni/"
        echo "HTTP Status: $DELETE_RESPONSE"
        cat response.txt

